<!DOCTYPE html>
<html lang="en">
<head>
    <title>Travel Form</title>
    <link rel="stylesheet" th:href="@{/css/travelform/travelForm.css}" />
</head>
<body>

<script th:src="@{/js/travelForm/newTravelForm.js}"></script>

<h1>Travel Form</h1>
<form name="travelForm" th:action="@{/new-travel-form/submit}" method="post" oninput="toggleConditionalQuestions()" onsubmit="return validateForm(event)">
    <input type="hidden" name="donorId" th:value="${donorId}" />

    <div class="form-section">
        <label for="question1" th:text="${questions[0].question}"></label>
        <select id="question1" name="question1">
            <option value="">Select an option</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>
    </div>

    <div class="form-section">
        <label for="question4" th:text="${questions[3].question}"></label>
        <select id="question4" name="question4">
            <option value="">Select an option</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>
    </div>

    <!-- Hidden sections for country, region, date, and submit button -->
    <div id="country-section" class="form-section" style="display: none;">
        <label for="country">Country:</label>
        <select id="country" name="country" onchange="loadRegions(this, 'country-section')">
            <option value="">Select a country</option>
            <th:block th:each="country : ${countries}">
                <option th:value="${country.countryId}" th:text="${country.countryName}"></option>
            </th:block>
        </select>
    </div>

    <!-- Updated region section to allow multiple selections -->
    <div id="region-section" class="form-section" style="display: none;">
        <label for="region">Region:</label>
        <select id="region" name="region[]" multiple>
            <option value="">Select a region</option>
        </select>
    </div>


    <div id="date-section" class="form-section" style="display: none;">
        <label for="date">Date:</label>
        <input type="date" id="date" name="date"/>
    </div>

    <div id="submit-button" style="display: none;">
        <button type="submit">Submit</button>
    </div>

    <div id="reload-button" style="display: none;">
        <button type="button" onclick="window.location.reload()">Back</button>
    </div>

</form>

<div id="finish-button">
    <a th:href="@{/donor/summary/{donorId}(donorId=${donorId})}">Finish</a>
</div>

</body>
</html>
