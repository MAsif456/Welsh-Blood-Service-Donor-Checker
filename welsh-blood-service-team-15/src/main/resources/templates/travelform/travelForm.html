<!DOCTYPE html>
<html lang="en">
<head>
    <title>Travel Form</title>
    <link rel="stylesheet" th:href="@{/css/travelform/travelForm.css}" />
    <link rel="stylesheet" th:href="@{/css/Global/globalStyles.css}" />
</head>
<body>

<script th:src="@{/js/travelForm/travelForm.js}"></script>

<!-- Sidebar for Donor Travelled To Countries -->
<div class="container">

    <div class="squiggly-border top-right">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none">
            <defs>
                <linearGradient id="gradientTopRight" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color: #8b0000; stop-opacity: 1" /> <!-- Dark red -->
                    <stop offset="100%" style="stop-color: #444444; stop-opacity: 1" /> <!-- Light red -->
                </linearGradient>
            </defs>
            <polygon points="0,0 100,0 100,100 50,90 25,95 0,100" fill="url(#gradientTopRight)" />
        </svg>
    </div>
    <div class="squiggly-border bottom-left">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none">
            <defs>
                <linearGradient id="gradientBottomLeft" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color: #8b0000; stop-opacity: 1" /> <!-- Dark red -->
                    <stop offset="100%" style="stop-color: #444444; stop-opacity: 1" /> <!-- Light red -->
                </linearGradient>
            </defs>
            <polygon points="0,0 25,5 50,10 100,0 100,100 0,100" fill="url(#gradientBottomLeft)" />
        </svg>
    </div>

    <aside class="travel-history">
        <h1>Destinations Added</h1>
        <ul>
            <li th:each="travel : ${donorTravelledToCountries}">
                <span><strong>Country:</strong> <span th:text="${travel.country.countryName}"></span></span><br>
                <span th:if="${travel.region != null}">
                    <strong>Region:</strong> <span th:text="${travel.region.regionName}"></span>
                </span><br>
                <span><strong>Return Date:</strong> <span th:text="${travel.endDate}"></span></span>
            </li>
        </ul>
    </aside>

    <!-- Main Form -->
    <main class="travel-form">
        <h1>Travel Form</h1>
        <form name="travelForm" th:action="@{/submit-travel-form}" method="post"
              oninput="toggleConditionalQuestions()" onsubmit="validateForm(event)">
            <input type="hidden" name="donorId" th:value="${donorId}" />
            <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>

            <div class="form-section">
                <label for="question1" th:text="${questions[0].question}"></label>
                <select id="question1" name="question1">
                    <option value="">Select an option</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <div class="form-section">
                <label for="question4" th:text="${questions[3].question}"></label>
                <select id="question4" name="question4">
                    <option value="">Select an option</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <!-- Hidden sections for country, region, date, and submit button -->
            <div id="country-section" class="form-section" style="display: none;">
                <label for="country">Country:</label>
                <select id="country" name="country" onchange="loadRegions(this)">
                    <option value="">Select a country</option>
                    <th:block th:each="country : ${countries}">
                        <option th:value="${country.countryId}" th:text="${country.countryName}"></option>
                    </th:block>
                </select>
            </div>

            <div id="region-section" class="form-section" style="display: none;">
                <label for="region">Region:</label>
                <select id="region" name="region[]" multiple>
                    <option value="">Select a region</option>
                </select>
            </div>

            <div id="date-section" class="form-section" style="display: none;">
                <label for="date">Date:</label>
                <input type="date" id="date" name="date" />
            </div>

            <div class="buttons">
                <div id="submit-button">
                    <button type="submit">Submit</button>
                </div>
                <div id="reload-button">
                    <button type="button" onclick="window.location.reload()">Back</button>
                </div>
            </div>
        </form>

        <div id="finish-button">
            <a th:href="@{/donorFormConfirmation(donorId=${donorId})}">Finish</a>
        </div>
    </main>
</div>
</body>
</html>
