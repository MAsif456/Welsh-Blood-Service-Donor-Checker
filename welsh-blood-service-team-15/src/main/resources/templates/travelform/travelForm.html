<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Travel Form</title>
    <link rel="stylesheet" th:href="@{/css/travelform/travelForm.css}" />
    <script>
        function toggleConditionalQuestions() {
            const formData = document.forms['travelForm'];
            const question1 = formData['question1'].value;
            const question4 = formData['question4'].value;

            document.getElementById('conditional1').style.display = question1 === 'Yes' ? 'block' : 'none';
            document.getElementById('conditional2').style.display = question4 === 'Yes' ? 'block' : 'none';
        }

        function validateQuestion3() {
            const formData = document.forms['travelForm'];
            const question3 = formData['question3'];
            const currentDate = new Date();
            const twelveMonthsAgo = new Date();
            twelveMonthsAgo.setFullYear(currentDate.getFullYear() - 1);

            const selectedDate = new Date(question3.value);

            if (selectedDate > currentDate || selectedDate < twelveMonthsAgo) {
                alert('Please enter a date within the last 12 months and not in the future.');
                question3.value = '';
            }
        }
    </script>
</head>
<body>
<h1>Travel Form</h1>
<form name="travelForm" th:action="@{/submit-travel-form}" th:object="${formData}" method="post" oninput="toggleConditionalQuestions()">
    <input type="hidden" th:name="donorId" th:value="${donorId}" />
    <div class="form-section">
        <label for="question1">Have you travelled abroad in the past 12 months?</label>
        <select id="question1" name="question1" th:field="*{question1}">
            <option value="">Select an option</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>
    </div>
    <div id="conditional1" class="form-section conditional">
        <div>
            <label for="question2">Where have you travelled in the last 12 months?</label>
            <select id="question2" name="question2" th:field="*{question2}">
                <option value="">Select a country</option>
                <th:block th:each="country : ${countries}">
                    <option th:value="${country.countryId}" th:text="${country.countryName}"></option>
                </th:block>
            </select>
        </div>
        <div>
            <label for="question3">When did you return from this country?</label>
            <input type="date" id="question3" name="question3" th:field="*{question3}" onchange="validateQuestion3()" />
        </div>
    </div>
    <div class="form-section">
        <label for="question4">Have you lived abroad for more than 6 months?</label>
        <select id="question4" name="question4" th:field="*{question4}">
            <option value="">Select an option</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>
    </div>
    <div id="conditional2" class="form-section conditional">
        <div>
            <label for="question5">Where have you lived abroad?</label>
            <select id="question5" name="question5" th:field="*{question5}">
                <option value="">Select a country</option>
                <th:block th:each="country : ${countries}">
                    <option th:value="${country.countryId}" th:text="${country.countryName}"></option>
                </th:block>
            </select>
        </div>
        <div>
            <label for="question6">When did you return from this country?</label>
            <input type="date" id="question6" name="question6" th:field="*{question6}" />
        </div>
    </div>
    <div class="form-section">
        <button type="submit">Submit</button>
    </div>
</form>
</body>
</html>
