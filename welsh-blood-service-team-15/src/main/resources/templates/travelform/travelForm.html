<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Travel Form</title>
    <link rel="stylesheet" th:href="@{/css/travelform/travelForm.css}" />
</head>
<body>
<h1>Travel Form</h1>
<form name="travelForm" th:action="@{/submit-travel-form}" th:object="${formData}" method="post" oninput="toggleConditionalQuestions()" onsubmit="validateForm(event)">
    <input type="hidden" th:name="donorId" th:value="${donorId}" />
    <div class="form-section">
        <label for="question1">Have you travelled abroad in the past 12 months?</label>
        <select id="question1" name="question1" th:field="*{question1}">
            <option value="">Select an option</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>
    </div>
    <div id="conditional1" class="form-section conditional" style="display: none;">
        <div id="countriesContainer1"></div>
        <button type="button" onclick="addCountry('countriesContainer1', 'question2_', 'question3_', 'Where have you travelled in the last 12 months?')">Add Country</button>
    </div>
    <div class="form-section">
        <label for="question4">Have you lived abroad for more than 6 months?</label>
        <select id="question4" name="question4" th:field="*{question4}">
            <option value="">Select an option</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>
    </div>
    <div id="conditional2" class="form-section conditional" style="display: none;">
        <div id="countriesContainer2"></div>
        <button type="button" onclick="addCountry('countriesContainer2', 'question5_', 'question6_', 'Where have you lived abroad?')">Add Country</button>
    </div>
    <div class="form-section">
        <button type="submit">Submit</button>
    </div>
</form>

<!-- Hidden divs to store options for JavaScript use -->
<div id="countryOptions" style="display: none;">
    <option value="">Select a country</option>
    <th:block th:each="country : ${countries}">
        <option th:value="${country.countryId}" th:text="${country.countryName}"></option>
    </th:block>
</div>

<div id="regionOptions" style="display: none;">
    <option value="">Select a region</option>
    <th:block th:each="region : ${regions}">
        <option th:value="${region.regionId}" th:text="${region.regionName}"></option>
    </th:block>
</div>

<!-- Link to external JavaScript file -->
<script th:src="@{/js/travelForm/travelForm.js}"></script>
</body>
</html>
