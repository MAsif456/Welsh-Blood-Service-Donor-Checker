<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/DecisionAndNotes/forms.css}">
    <title>Decisions Page</title>
</head>
<body>
<form th:action="@{/submit-decisions}" method="post">
    <input type="hidden" name="donorId" th:value="${donor.donorId}"/>

    <div class="container">
        <div class="donor-details">
            <label for="donorDetails-name">Donor Name:</label>
            <input type="text" id="donorDetails-name" th:value="${donor.firstName + ' ' + donor.lastName}" readonly>
        </div>

        <div class="decision-container">
            <h3>Decisions</h3>
            <label>
                <input type="radio" class="radio" value="Eligible to donate today" name="decision" th:checked="${decision == 'Eligible to donate today'}"> Eligible to donate today
            </label>
            <label>
                <input type="radio" class="radio" value="Eligible to donate but further testing needed" name="decision" th:checked="${decision == 'Eligible to donate but further testing needed'}"> Eligible to donate but further testing needed
            </label>
            <label>
                <input type="radio" class="radio" value="Eligible to donate but must wait 6 months" name="decision" th:checked="${decision == 'Eligible to donate but must wait 6 months'}"> Eligible to donate but must wait 6 months
            </label>
            <label>
                <input type="radio" class="radio" value="Not Eligible to donate at all" name="decision" th:checked="${decision == 'Not Eligible to donate at all'}"> Not Eligible to donate at all
            </label>
        </div>

        <div class="notes-container">
            <h3>Notes</h3>
            <textarea id="notes" name="notes" placeholder="Enter notes here" rows="4" cols="50" th:text="${notes}"></textarea>
        </div>

        <div class="submit-container">
            <div th:if="${decision != null && notes != null}">
                <p>Donor was already submitted.</p>
            </div>
            <div th:if="${decision == null || notes == null}">
                <button type="submit" class="submit-button">Submit</button>
            </div>
        </div>
    </div>
</form>
</body>
</html>
