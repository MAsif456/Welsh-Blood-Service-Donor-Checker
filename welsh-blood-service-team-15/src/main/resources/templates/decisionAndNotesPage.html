<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <title>Decisions Page</title>
</head>
<body>
<form th:action="@{/submit-decisions}" method="post">
<div class="container">
    <label for="donor-name">Donor Name:</label>
    <input type="text" id="donor-name" value="" readonly>
</div>

<div class="decision-container">
    <h3>Decisions</h3>
    <label>
        <input type="checkbox" class="radio" value="1" name="decision-one" />Eligible to donate today</label>
    <label>
        <input type="checkbox" class="radio" value="1" name="decision-two" />Eligible to donate but further testing needed</label>
    <label>
        <input type="checkbox" class="radio" value="1" name="decision-three" />Eligible to donate but must wait 6 months</label>
    <label>
        <input type="checkbox" class="radio" value="1" name="decision-four" />Not Eligible to donate at all</label>
</div>

<div class="notes-container">
    <h3>Notes</h3>
    <textarea id="notes" rows="4" cols="50" style="height: 332px; resize: none;">Enter notes here</textarea>
</div>
<button type="button" class="btn btn-primary">Submit</button>
</form>
</body>
</html>
