<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <title>Decisions Page</title>
</head>
<body>
<form th:action="@{/submit-decisions}" method="post">
    <input type="hidden" name="donorId" th:value="${donorId}"/>
<div class="container">
    <label for="donorDetails-name">Donor Name:</label>
    <input type="text" id="donorDetails-name" th:value="${donor.firstName + ' ' + donor.lastName}" readonly>
</div>

<div class="decision-container">
    <h3>Decisions</h3>
    <label>
        <input type="radio" class="radio" value="Eligible to donate today" name="decision" />Eligible to donate today</label>
    <label>
        <input type="radio" class="radio" value="Eligible to donate but further testing needed" name="decision" />Eligible to donate but further testing needed</label>
    <label>
        <input type="radio" class="radio" value="Eligible to donate but must wait 6 months" name="decision" />Eligible to donate but must wait 6 months</label>
    <label>
        <input type="radio" class="radio" value="Not Eligible to donate at all" name="decision" />Not Eligible to donate at all</label>
</div>

<div class="notes-container">
    <h3>Notes</h3>
    <textarea id="notes" name = "notes" placeholder="Enter notes here" rows="4" cols="50" style="height: 332px; resize: none;"></textarea>
</div>

    <div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </div>

</form>
</body>
</html>
