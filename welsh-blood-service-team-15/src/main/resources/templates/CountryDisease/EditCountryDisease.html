<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Country Disease</title>
    <link rel="stylesheet" th:href="@{/css/editDisease/form.css}" />
    <link rel="stylesheet" th:href="@{/css/Fragments/navigationbar.css}"/>

</head>
<body>
<script th:src="@{/js/travelForm/travelForm.js}"></script>

<div th:replace="~{Fragments/navigationbar :: navbar}"></div>

<div class="editForm">
<h1>Edit Country Disease</h1>
<!-- Dropdown to select a country -->
<form th:action="@{/edit-disease/view}" method="get">
    <label for="country">Country:</label>
    <select name="countryId" id="country">
        <option value="" disabled selected>Select a country</option>
        <option th:each="country : ${countries}" th:value="${country.countryId}" th:text="${country.countryName}" th:selected="${selectedCountry == country.countryId}"></option>
    </select>
    <button type="submit">View Disease Risks</button>
</form>

<!-- Display the results -->
<div th:if="${diseaseRisks}">
    <h2>Disease Risks</h2>
    <ul>
        <li th:each="risk : ${diseaseRisks}">
            <p><strong>Country:</strong> <span th:text="${risk.country.countryName}"></span></p>
            <p><strong>Region:</strong> <span th:text="${risk.disease.diseaseName}"></span></p>
            <p th:if="${risk.disease.diseaseName}"><strong>Disease Name:</strong> <span th:text="${risk.disease.diseaseName}"></span></p>
            <p th:if="${risk.disease != null}"><strong>Relevant Notes:</strong><span th:if="${risk.note != null}" th:text="${risk.note}"></span></p>
            <strong>Disease Active Period:</strong> <span th:text="${risk.startDate}"></span> to <span th:text="${risk.endDate}"></span>
            <p th:if="${risk.deferralPeriod != null}"><strong>Deferral Period (days):</strong> <span th:text="${risk.deferralPeriod.periodDays}"></span></p>
            <p th:if="${risk.deferralNote != null}"><strong>Deferral Note:</strong> <span th:text="${risk.deferralNote}"></span></p>


            <a th:href="@{/edit-disease/form(id=${risk.id})}">Edit</a>

        </li>
    </ul>
</div>

</div>

</body>
</html>
