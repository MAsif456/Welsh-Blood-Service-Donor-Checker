<!DOCTYPE html>
<html xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <title>Donor Records</title>
    <link rel="stylesheet" href="/css/Donor/donor-records.css" />
    <link rel="stylesheet" th:href="@{/css/Fragments/navigationbar.css}"/>

</head>
<body>

<div th:replace="~{Fragments/navigationbar :: navbar}"></div>

<h1>Donor Records</h1>

<form action="/search-donor" method="get">
    <input type="number" name="id" placeholder="Search by ID">
    <button type="submit">Search</button>
</form>

<div class="error-message" th:if="${error}">
    <p th:text="${error}"></p>
</div>

<table class="Donor-Table">
    <thead>
    <tr>
        <th>Donor ID</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Status</th>
        <th>View Summary</th>
        <th sec:authorize="hasRole('ROLE_ADMIN')">Decision Made By</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="donor : ${donors}">
        <td th:text="${donor.donorId}"></td>
        <td th:text="${donor.firstName}"></td>
        <td th:text="${donor.lastName}"></td>
        <td th:text="${donor.status}"></td>
        <td><a th:href="@{/donor/summary/{id}(id=${donor.donorId})}">View Summary</a></td>
        <td sec:authorize="hasRole('ROLE_ADMIN')" th:text="${donor.getDecisionMade()}"></td>
    </tr>
    </tbody>
</table>

<div class="no-records-found" th:if="${noRecordsFound}">
    <p>No donor records found.</p>
</div>

</body>
</html>
