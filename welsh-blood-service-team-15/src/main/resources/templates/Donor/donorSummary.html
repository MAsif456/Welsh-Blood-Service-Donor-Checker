<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Donor Summary</title>
    <link rel="stylesheet" th:href="@{/css/donor/summary.css}" />
</head>
<body>
<div class="donor-summary">
    <h1>Donor Summary</h1>
    <p><strong>Name:</strong> <span th:text="|${donor.firstName} ${donor.lastName}|"></span></p>
    <p><strong>Date of Birth:</strong> <span th:text="${donor.donorDob}"></span></p>
    <p><strong>Risk Level:</strong>
        <span th:classappend="${donor.donorRisk == 'High' ? 'risk-high' :
                          (donor.donorRisk == 'Moderate' ? 'risk-moderate' : 'risk-low')}"
              th:text="${donor.donorRisk}"></span>
    </p>


    <h2>Travel History</h2>
    <div class="travel-history">
        <ul>
            <li th:each="travel : ${donor.travelHistory}">
                <p><strong>Country:</strong> <span th:text="${travel.country.countryName}"></span></p>
                <p><strong>Visit Dates:</strong> <span th:text="${travel.startDate}"></span> to
                    <span th:text="${travel.endDate}"></span></p>
            </li>
        </ul>
    </div>

    <h2>Questionnaire Answers</h2>
    <div class="travel-history">
        <ul>
            <li><p>Donor travelled through Germany on 11-09-2020</p></li>
            <li><p>Donor lived in France from 06-2015 to 08-2020</p></li>
            <li><p>Is in a relationship with someone who moved from China on 04-2024</p></li>
        </ul>
    </div>

</div>
</body>

</html>
