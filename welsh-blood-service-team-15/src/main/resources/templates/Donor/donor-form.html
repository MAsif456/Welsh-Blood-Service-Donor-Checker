<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>New Donor</title>
    <link rel="stylesheet" th:href="@{/css/Donor/donor-form.css}" />
    <link rel="stylesheet" th:href="@{/css/Global/globalStyles.css}" />
</head>
<body>

<div class="container">

<div class="squiggly-border top-right">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <polygon points="0,0 100,0 100,100 50,90 25,95 0,100" fill="#b22222" />
    </svg>
</div>
<div class="squiggly-border bottom-left">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <polygon points="0,0 25,5 50,10 100,0 100,100 0,100" fill="#b22222" />
    </svg>
</div>

<h1>Add A New Donor</h1>
<form action="#" th:action="@{/donor-form}" th:object="${donorForm}" method="post">
    <div>
        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" th:field="*{firstName}" />
        <div class="alert alert-warning" th:errors="*{firstName}"
             th:if="${#fields.hasErrors('firstName')}">First Name Error</div>

    </div>
    <div>
        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" th:field="*{lastName}" />
        <div class="alert alert-warning" th:errors="*{lastName}"
             th:if="${#fields.hasErrors('lastName')}">Last Name Error</div>
    </div>
    <div>
        <label for="donorDob">Date of Birth:</label>
        <input type="date" id="donorDob" th:field="*{donorDob}" />
        <div class="alert alert-warning" th:errors="*{donorDob}"
             th:if="${#fields.hasErrors('donorDob')}">Date Of Birth Error</div>
    </div>
    <div>
        <input type="hidden" th:field="*{donorId}" />
    </div>
    <div>
        <button type="submit">Submit</button>

    </div>
</form>

</div>


</body>
</html>
