# Used to import external config file
spring.config.import=optional:file:Config/external-config.properties
server.port=8081 
spring.profiles.active=dev

# Application Variables
spring.application.name=${APPLICATION_NAME:welsh-blood-service-team-15}
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/WelshBlood}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:comsc}


spring.sql.init.mode=always
debug=true
#sql logging
logging.level.org.springframework.boot.context.config=DEBUG
logging.level.org.springframework.boot=DEBUG
